# GitHub Pages 자동 배포: main에 푸시하면 game/ 폴더를 올림(첫 화면 = 게임)
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions"로. 무료 계정은 저장소가 공개(Public)여야 함.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # 저장소가 비공개인 동안(무료 계정은 Pages를 못 씀)에는 실패 대신 건너뜀
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 올릴 파일 모으기
        run: |
          mkdir _site
          cp -r game/. _site/
          rm -rf _site/src _site/assets/*.png _site/assets/portraits/*.png _site/models/*.glb
          mv _site/index.html _site/compare.html
          cp _site/play.html _site/index.html
          sed -i 's#href="index.html"#href="compare.html"#g' _site/a.html _site/b.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
